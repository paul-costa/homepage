name: ci

# Install, build and audit on every pull request and push to main. Nothing is deployed from here:
# the site goes to costaserver by hand with scripts/deploy.sh.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Dev-only advisories are Dependabot's business; a high one in what ships fails here.
      - name: No known high vulnerability in a production dependency
        run: npm audit --omit=dev --audit-level=high
